<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期权策略系统课 · 课程表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;color:#e8ecf4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.hero{padding:34px 0 10px}
.hero h1{font-size:26px;margin-bottom:8px}
.hero p{color:#aab3c5;font-size:14px}
.progress{background:#131a30;border:1px solid #1e2740;border-radius:12px;padding:14px 16px;margin:16px 0;font-size:13.5px;color:#aab3c5}
.progress b{color:#7dd3fc}
.bar{height:8px;background:#0e1428;border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#7dd3fc;border-radius:4px}
.tier{margin:26px 0 6px;font-size:15px;font-weight:700}
.tier span{color:#8b93a7;font-weight:400;font-size:12.5px;margin-left:8px}
.lesson{display:flex;align-items:center;gap:12px;background:#131a30;border:1px solid #1e2740;border-radius:10px;padding:11px 14px;margin:8px 0;text-decoration:none;color:#e8ecf4}
a.lesson:hover{border-color:#7dd3fc}
.lesson .num{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:#0e1428;border:1px solid #1e2740;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#7dd3fc}
.lesson .t{flex:1 1 auto;min-width:0}
.lesson .en{font-size:14px;font-weight:600}
.lesson .cn{font-size:12px;color:#8b93a7}
.lesson .cat{flex:0 0 auto;font-size:10.5px;color:#8b93a7;border:1px solid #1e2740;border-radius:6px;padding:2px 8px;white-space:nowrap}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.badge.live{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.4)}
.badge.soon{background:#0e1428;color:#5b6b8c;border:1px solid #1e2740}
div.lesson{opacity:.75}
.footer{margin-top:34px;padding-top:16px;border-top:1px solid #1e2740;color:#5b6b8c;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>期权策略系统课</h1>
<p>58 节 · Novice → Expert · 每节配图文课件：结构 / Payoff / 希腊字母 / 实盘关联 / 随堂小测</p>
</div>
<div class="progress"><b>{{DONE}}</b> / 58 节已发布<div class="bar"><i style="width:{{PCT}}%"></i></div></div>
{{TIERS}}
<div class="footer">期权策略系统课 · 仅供学习，不构成投资建议</div>
</div>
</body>
</html>
