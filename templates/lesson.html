<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} · 期权策略课</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;color:#e8ecf4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.topnav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1e2740;margin-bottom:18px;font-size:13px}
.topnav a{color:#7dd3fc;text-decoration:none}
.hero{margin:6px 0 4px}
.kicker{color:#7dd3fc;font-size:12.5px;letter-spacing:1px;margin-bottom:6px}
.hero h1{font-size:26px;margin-bottom:6px}
.hero h1 .cn{font-size:17px;font-weight:400;color:#aab3c5}
.tagline{color:#aab3c5;font-size:14px}
.card{background:#131a30;border:1px solid #1e2740;border-radius:14px;padding:18px;margin:14px 0}
.sec{font-size:13px;font-weight:700;color:#7dd3fc;margin-bottom:10px;letter-spacing:1px}
.muted{color:#8b93a7;font-size:13px;margin-bottom:8px}
.body{font-size:14px}
.steps{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.step{flex:1 1 0;min-width:110px;background:#0e1428;border:1px solid #1e2740;border-radius:10px;padding:12px;text-align:center;font-size:13px}
.step b{display:block;font-size:14px;margin-bottom:6px;color:#7dd3fc}
.step span{color:#aab3c5}
.arr{align-self:center;color:#5b6b8c;font-size:20px;flex:0 0 auto}
.chart{width:100%;height:auto;display:block}
.slider{width:100%;accent-color:#7dd3fc;margin-top:6px}
.readout{font-size:15px;font-weight:700;margin-top:10px;text-align:center;min-height:24px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1 1 0;min-width:120px;background:#0e1428;border:1px solid #1e2740;border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:#8b93a7}
.kpi .v{font-size:16px;font-weight:700}
.pos{color:#22c55e}.neg{color:#ef4444}
.greek{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed #1e2740;font-size:14px}
.greek:last-child{border-bottom:none}
.badge{flex:0 0 auto;min-width:78px;text-align:center;font-weight:700;font-size:12.5px;border-radius:6px;padding:4px 6px}
.badge.pos{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.4)}
.badge.neg{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.4)}
.ul{padding-left:20px;font-size:14px}
.ul li{margin:6px 0}
.card.warn{border-left:4px solid #f59e0b}
details{background:#0e1428;border:1px solid #1e2740;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:14px}
summary{cursor:pointer;font-weight:600}
.ans{color:#7dd3fc;font-weight:700}
.pagenav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pagenav a{flex:1;background:#131a30;border:1px solid #1e2740;border-radius:10px;padding:12px;color:#e8ecf4;text-decoration:none;font-size:13.5px}
.pagenav a span{display:block;font-size:11.5px;color:#8b93a7}
.pagenav a.next{text-align:right}
.pagenav a.disabled{opacity:.35;pointer-events:none}
.footer{margin-top:34px;padding-top:16px;border-top:1px solid #1e2740;color:#5b6b8c;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="topnav"><a href="/options/">‹ 课程表</a><span>第 {{N}} 课 / 58</span></div>
{{BODY}}
<div class="pagenav">
{{PREV_LINK}}
{{NEXT_LINK}}
</div>
<div class="footer">期权策略系统课 · 仅供学习，不构成投资建议</div>
</div>
</body>
</html>
